<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصحيح الآلي المعتمدة - ثانوية الأمير عبدالمجيد</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --bg: #f8fafc; --card-bg: #ffffff; --accent: #0284c7; --text-main: #1e293b; --border: #e2e8f0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .scanner-container { max-width: 750px; width: 100%; background: var(--card-bg); border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px dashed var(--accent); box-sizing: border-box; }
        h1 { color: var(--accent); font-size: 1.4rem; text-align: center; margin-top: 0; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; font-size: 0.85rem; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; background: #fff; box-sizing: border-box; }
        
        .student-select-box { position: relative; }
        .student-dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 0 0 8px 8px; max-height: 150px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .student-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; text-align: right; }
        .student-item:hover { background: #e0f2fe; color: #0369a1; font-weight: bold; }

        .comparison-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #f8fafc; padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; }
        .ans-card { background: #fff; padding: 6px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font-size: 0.8rem; }
        .ans-card.correct-match { background: #d1fae5; border-color: #34d399; }
        .ans-card.wrong-match { background: #fee2e2; border-color: #f87171; }
        .ans-card select { width: 100%; padding: 2px; font-size: 0.8rem; text-align: center; margin-top: 3px; font-weight: bold; }

        .camera-btn { width: 100%; background: #0284c7; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; margin-bottom: 10px; }
        .camera-btn:hover { background: #0369a1; }
        #previewContainer { text-align: center; margin-bottom: 15px; display: none; }
        #capturedImage { max-width: 100%; max-height: 150px; border-radius: 8px; border: 2px solid #10b981; }

        .submit-btn { width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .submit-btn:hover { background: #059669; }
        .status-msg { font-size: 0.8rem; color: #059669; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .footer-note { text-align: center; font-size: 0.75rem; color: #64748b; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px; }

</head>

<div class="scanner-container">

    <p class="subtitle">اختر النموذج لتظهر المفاتيح المظللة، اختر اسم الطالب، صور ورقة التظليل وأرسل</p>

    <div class="form-group">
        <label>اختر النموذج:</label>
        <select id="targetModelSelect" onchange="applyModelKey()">

            <option value="النموذج الثاني (ب)">النموذج الثاني (ب)</option>

            <option value="النموذج الخامس (هـ)">النموذج الخامس (هـ)</option>
        </select>
    </div>

    <div class="form-group">
        <label>اسم النموذج المعتمد:</label>
        <input type="text" id="customModelName" value="النموذج الأول (أ)">
    </div>

    <div id="keyStatus" class="status-msg"></div>

    <div class="form-group">
        <label>ابحث عن اسم الطالب واختاره:</label>
        <div class="student-select-box">
            <input type="text" id="studentSearchInput" placeholder="اكتب اسم الطالب للبحث..." oninput="filterStudents()" onclick="showDropdown()">
            <div id="studentDropdownList" class="student-dropdown-list"></div>
        </div>
    </div>

    <div class="form-group">
        <label>تصوير ورقة تظليل الطالب:</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="previewCapturedImage(this)">
        <button class="camera-btn" onclick="document.getElementById('cameraInput').click()">
            📸 فتح الكاميرا وتصوير ورقة الطالب
        </button>
        <div id="previewContainer">
            <img id="capturedImage" src="" alt="معاينة الورقة">
            <div style="color: #059669; font-weight: bold; font-size: 0.8rem; margin-top: 4px;">✅ تم التقاط صورة ورقة الطالب بنجاح</div>
        </div>
    </div>

    <label style="margin-bottom: 5px;">مقارنة إجابات الطالب مع المفتاح المعتمد (من 1 إلى 20):</label>
    <div class="comparison-grid" id="studentAnswersContainer"></div>

    <button class="submit-btn" onclick="processAndSendToDashboard()">تصحيح وإرسال الدرجة الحقيقية لوحة التحكم</button>

    <div class="footer-note">
        ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </div>
</div>

    window.onload = function() {
        applyModelKey();
        loadAllowedStudents();
    };

    function applyModelKey() {
        const select = document.getElementById('targetModelSelect');
        const modelName = select.value;
        document.getElementById('customModelName').value = modelName;

        const currentModelData = modelQuestionsBank[modelName];
        const container = document.getElementById('studentAnswersContainer');
        container.innerHTML = '';

        if (currentModelData) {
            for (let i = 1; i <= 20; i++) {
                let correctAns = currentModelData[i].correct;
                container.innerHTML += `
                    <div class="ans-card" id="card_${i}">
                        <div style="font-weight:bold; color:#0284c7;">س ${i}</div>
                        <div style="font-size:0.75rem; color:#10b981; margin:2px 0;">المفتاح: ${correctAns}</div>
                        <select id="stud_ans_${i}" onchange="checkAnswerMatch(${i}, '${correctAns}')">
                            <option value="A">أ</option>
                            <option value="B">ب</option>
                            <option value="C">ج</option>
                            <option value="D">د</option>
                        </select>
                    </div>
                `;
                document.getElementById(`stud_ans_${i}`).value = correctAns;
                checkAnswerMatch(i, correctAns);
            }
            document.getElementById('keyStatus').innerText = `✅ تم عرض مفاتيح (${modelName}) المظللة والمقارنة بنجاح!`;
        }
    }

    function checkAnswerMatch(qNum, correctAns) {
        let studentAns = document.getElementById(`stud_ans_${qNum}`).value;
        let card = document.getElementById(`card_${qNum}`);
        if (studentAns === correctAns) {
            card.className = "ans-card correct-match";
        } else {
            card.className = "ans-card wrong-match";
        }
    }

    function loadAllowedStudents() {
        db.collection("allowed_students").orderBy("name").get().then((snapshot) => {
            allStudents = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if(data.name) allStudents.push(data.name);
            });
            renderStudentDropdown(allStudents);
        }).catch((error) => {
            console.error("خطأ في جلب الطلاب:", error);
        });
    }

    function renderStudentDropdown(studentsArray) {
        const listDiv = document.getElementById('studentDropdownList');
        listDiv.innerHTML = '';
        if (studentsArray.length === 0) {
            listDiv.innerHTML = '<div class="student-item" style="color:#999;">لا توجد نتائج مطابقة</div>';
            return;
        }
        studentsArray.forEach(name => {
            const item = document.createElement('div');
            item.className = 'student-item';
            item.innerText = name;
            item.onclick = function() {
                document.getElementById('studentSearchInput').value = name;
                listDiv.style.display = 'none';
            };
            listDiv.appendChild(item);
        });
    }

    function showDropdown() {
        const listDiv = document.getElementById('studentDropdownList');
        listDiv.style.display = 'block';
        renderStudentDropdown(allStudents);
    }

    function filterStudents() {
        const query = document.getElementById('studentSearchInput').value.trim().toLowerCase();
        const filtered = allStudents.filter(name => name.toLowerCase().includes(query));
        renderStudentDropdown(filtered);
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.student-select-box')) {
            document.getElementById('studentDropdownList').style.display = 'none';
        }
    });

    function previewCapturedImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('capturedImage').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
                imageCaptured = true;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function processAndSendToDashboard() {
        const studentName = document.getElementById('studentSearchInput').value.trim();
        const customModelName = document.getElementById('customModelName').value.trim() || "أوراق التظليل";
        const selectedModel = document.getElementById('targetModelSelect').value;
        const fileInput = document.getElementById('cameraInput');

        if (!studentName) {
            alert('الرجاء اختيار اسم الطالب من القائمة أولاً.');
            return;
        }
        if (!imageCaptured || fileInput.files.length === 0) {
            alert('الرجاء التقاط صورة ورقة الطالب بالكاميرا أولاً.');
            return;
        }

        const currentModelData = modelQuestionsBank[selectedModel];
        let answersDetails = [];
        let score = 0;
        
        for (let i = 1; i <= 20; i++) {
            let studentAnsKey = document.getElementById(`stud_ans_${i}`).value; 
            let correctAnsKey = currentModelData[i].correct; 
            let isCorrect = (studentAnsKey === correctAnsKey);
            if (isCorrect) score++;

            let qObj = currentModelData[i];
            answersDetails.push({
                qText: qObj.q,
                studentAns: `${studentAnsKey}) ${qObj.options[studentAnsKey]}`,
                correctAns: `${correctAnsKey}) ${qObj.options[correctAnsKey]}`,
                isCorrect: isCorrect,
                skill: i <= 4 ? 'est' : i <= 8 ? 'ikm' : i <= 12 ? 'swh' : i <= 16 ? 'arb' : 'sah'
            });
        }

        let p = Math.round((score / 20) * 100);
        let skillsObj = { est: p, ikm: p, swh: p, arb: p, sah: p, math: p };

        let recordData = {
            name: studentName,
            score: score,
            total: 20,
            model_id: customModelName,
            answers: answersDetails,
            sections: skillsObj,
            time: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("alkfaeat_results").add(recordData);
            alert(`✅ تم تصحيح ورقة الطالب (${studentName}) بنجاح!\nالدرجة: ${score} من 20 (${p}%) تحت (${customModelName})`);
            
            document.getElementById('studentSearchInput').value = '';
            fileInput.value = '';
            document.getElementById('previewContainer').style.display = 'none';
            imageCaptured = false;
            applyModelKey();
        } catch (error) {
            alert("حدث خطأ أثناء الإرسال لقاعدة البيانات.");
        }
    }
