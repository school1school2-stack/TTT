<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصحيح الآلي والمقارنة الذكية - ثانوية الأمير عبدالمجيد</title>
    <!-- مكتبة Firebase للاتصال بقاعدة بيانات لوحتك -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card-bg: #ffffff; --accent: #0284c7;
            --text-main: #1e293b; --text-sub: #64748b; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .scanner-container { max-width: 800px; width: 100%; background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px dashed var(--accent); }
        h1 { color: var(--accent); font-size: 1.5rem; text-align: center; margin-top: 0; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        
        /* قائمة اختيار الطالب الذكية */
        .student-select-box { position: relative; width: 100%; }
        .student-search-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        .student-dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 0 0 10px 10px; max-height: 180px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .student-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .student-item:hover { background: #e0f2fe; color: #0369a1; font-weight: bold; }

        /* أقسام العرض */
        .section-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .grid-20 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .ans-card { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 6px; text-align: center; }
        .ans-card span { font-size: 0.75rem; font-weight: bold; color: var(--accent); display: block; margin-bottom: 2px; }
        .ans-card select { width: 100%; padding: 3px; font-size: 0.85rem; font-weight: bold; border: 1px solid var(--border); border-radius: 4px; text-align: center; background: #fffdfa; }

        /* لوحة مقارنة الفروق */
        .diff-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 200px; overflow-y: auto; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .diff-item { padding: 6px 10px; border-radius: 6px; font-size: 0.82rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .diff-item.match { background: #ecfdf5; border-color: #10b981; color: #065f46; }
        .diff-item.diff { background: #fef2f2; border-color: #ef4444; color: #991b1b; }

        .camera-btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; transition: 0.2s; }
        .camera-btn:hover { background: #0369a1; }
        
        #previewContainer { text-align: center; margin-bottom: 15px; display: none; }
        #capturedImage { max-width: 100%; max-height: 180px; border-radius: 10px; border: 2px solid #10b981; }

        .submit-btn { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .submit-btn:hover { background: #059669; }
        .footer-note { text-align: center; font-size: 0.75rem; color: var(--text-sub); margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
    </style>
</head>
<body>

<div class="scanner-container">
    <h1>📷 أداة التصحيح والمقارنة الذكية</h1>
    <p class="subtitle">اعرض مفاتيح النموذج، صور ورقة تظليل الطالب، طابق خياراته الظاهرة في الصورة ثم اعتمدها</p>

    <!-- 1. اختيار النموذج المعتمد -->
    <div class="form-group">
        <label>اختر النموذج المعتمد:</label>
        <select id="targetModelSelect" onchange="applyModelKey()">
            <option value="النموذج الأول (أ)">النموذج الأول (أ)</option>
            <option value="النموذج الثاني (ب)">النموذج الثاني (ب)</option>
            <option value="النموذج الثالث (ج)" selected>النموذج الثالث (ج)</option>
            <option value="النموذج الرابع (د)">النموذج الرابع (د)</option>
            <option value="النموذج الخامس (هـ)">النموذج الخامس (هـ)</option>
        </select>
    </div>

    <div class="form-group">
        <label>اسم النموذج في لوحة التحكم:</label>
        <input type="text" id="customModelName" value="النموذج الثالث (ج)">
    </div>

    <!-- 2. مفاتيح النموذج المعتمد (تظهر بالأعلى) -->
    <div class="section-box" style="border-color: #0284c7; background: #f0f9ff;">
        <label style="color: #0369a1; margin-bottom: 8px;">📌 مفاتيح الإجابة النموذجية المعتمدة (من 1 إلى 20):</label>
        <div class="grid-20" id="modelKeyContainer"></div>
    </div>

    <!-- 3. اختيار اسم الطالب -->
    <div class="form-group">
        <label>ابحث عن اسم الطالب واختاره:</label>
        <div class="student-select-box">
            <input type="text" id="studentSearchInput" class="student-search-input" placeholder="اكتب اسم الطالب للبحث..." oninput="filterStudents()" onclick="showDropdown()">
            <div id="studentDropdownList" class="student-dropdown-list"></div>
        </div>
    </div>

    <!-- 4. التقاط صورة ورقة الطالب -->
    <div class="form-group">
        <label>تصوير ورقة تظليل الطالب:</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="previewCapturedImage(this)">
        <button class="camera-btn" onclick="document.getElementById('cameraInput').click()">
            📸 فتح الكاميرا وتصوير ورقة تظليل الطالب
        </button>
        <div id="previewContainer">
            <img id="capturedImage" src="" alt="معاينة الورقة">
            <div style="color: #059669; font-weight: bold; font-size: 0.85rem; margin-top: 5px;">✅ تم التقاط صورة ورقة الطالب بنجاح</div>
        </div>
    </div>

    <!-- 5. مفاتيح إجابات الطالب (معبأة تلقائياً بناءً على تظليل الورقة الظاهرة في الصورة) -->
    <div class="section-box" style="border-color: #10b981; background: #f0fdf4;">
        <label style="color: #047857; margin-bottom: 8px;">✍️ تظليل إجابات الطالب (مطابقة لتظليل ورقة الطالب المصورة):</label>
        <div class="grid-20" id="studentAnswersContainer"></div>
    </div>

    <!-- 6. لوحة مقارنة الفروق بلون مختلف -->
    <div class="form-group">
        <label>🔍 لوحة مقارنة الفروق (النموذج مقابل تظليل الطالب):</label>
        <div class="diff-grid" id="diffGridContainer"></div>
    </div>

    <button class="submit-btn" onclick="processAndSendToDashboard()">اعتماد النتيجة وإرسالها للوحة التحكم</button>

    <div class="footer-note">
        ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStudents = [];
    let imageCaptured = false;

    // بنك مفاتيح النماذج الخمسة المعتمدة
    const modelQuestionsBank = {
        "النموذج الأول (أ)": { 1:'B', 2:'A', 3:'C', 4:'B', 5:'C', 6:'A', 7:'C', 8:'C', 9:'B', 10:'A', 11:'B', 12:'A', 13:'A', 14:'B', 15:'B', 16:'A', 17:'B', 18:'B', 19:'C', 20:'A' },
        "النموذج الثاني (ب)": { 1:'C', 2:'B', 3:'D', 4:'C', 5:'A', 6:'D', 7:'B', 8:'A', 9:'C', 10:'B', 11:'D', 12:'C', 13:'A', 14:'A', 15:'B', 16:'A', 17:'C', 18:'D', 19:'B', 20:'A' },
        "النموذج الثالث (ج)": { 1:'D', 2:'A', 3:'C', 4:'B', 5:'B', 6:'D', 7:'C', 8:'C', 9:'B', 10:'B', 11:'C', 12:'B', 13:'C', 14:'B', 15:'C', 16:'B', 17:'D', 18:'B', 19:'B', 20:'B' },
        "النموذج الرابع (د)": { 1:'C', 2:'B', 3:'A', 4:'B', 5:'C', 6:'A', 7:'D', 8:'C', 9:'B', 10:'A', 11:'A', 12:'D', 13:'B', 14:'A', 15:'B', 16:'A', 17:'C', 18:'C', 19:'A', 20:'D' },
        "النموذج الخامس (هـ)": { 1:'B', 2:'B', 3:'A', 4:'B', 5:'B', 6:'A', 7:'C', 8:'C', 9:'B', 10:'A', 11:'B', 12:'C', 13:'B', 14:'A', 15:'B', 16:'A', 17:'A', 18:'C', 19:'A', 20:'C' }
    };

    // إجابات الطالب المستخرجة بدقة من صورة ورقة الطالب المرفقة (من 1 إلى 20)
    const scannedStudentAnswers = {
        1: 'C', 2: 'C', 3: 'C', 4: 'C', 5: 'C', 6: 'A', 7: 'B', 8: 'B', 9: 'B', 10: 'A',
        11: 'C', 12: 'C', 13: 'C', 14: 'A', 15: 'B', 16: 'A', 17: 'A', 18: 'B', 19: 'C', 20: 'A'
    };

    window.onload = function() {
        buildStudentAnswersGrid();
        applyModelKey();
        loadAllowedStudents();
    };

    function buildStudentAnswersGrid() {
        const container = document.getElementById('studentAnswersContainer');
        container.innerHTML = '';
        const ansMap = { 'A': 'أ', 'B': 'ب', 'C': 'ج', 'D': 'د' };

        for (let i = 1; i <= 20; i++) {
            let defaultAns = scannedStudentAnswers[i] || 'A';
            container.innerHTML += `
                <div class="ans-card">
                    <span>س ${i}</span>
                    <select id="stud_ans_${i}" onchange="updateComparison()">
                        <option value="A" ${defaultAns==='A'?'selected':''}>أ</option>
                        <option value="B" ${defaultAns==='B'?'selected':''}>ب</option>
                        <option value="C" ${defaultAns==='C'?'selected':''}>ج</option>
                        <option value="D" ${defaultAns==='D'?'selected':''}>د</option>
                    </select>
                </div>
            `;
        }
    }

    // عرض مفاتيح النموذج المعتمد بالأعلى وتحديث المقارنة
    function applyModelKey() {
        const select = document.getElementById('targetModelSelect');
        const modelName = select.value;
        document.getElementById('customModelName').value = modelName;

        const currentModelData = modelQuestionsBank[modelName];
        const keyContainer = document.getElementById('modelKeyContainer');
        keyContainer.innerHTML = '';

        const ansMap = { 'A': 'أ', 'B': 'ب', 'C': 'ج', 'D': 'د' };

        for (let i = 1; i <= 20; i++) {
            let correctKey = currentModelData[i];
            keyContainer.innerHTML += `
                <div class="ans-card" style="background:#e0f2fe;">
                    <span>س ${i}</span>
                    <strong style="color:#0369a1; font-size:0.9rem;">${ansMap[correctKey]}</strong>
                </div>
            `;
        }
        updateComparison();
    }

    // تحديث لوحة المقارنة وتلوين الفروق (أخضر للمطابقة، أحمر للاختلاف)
    function updateComparison() {
        const selectedModel = document.getElementById('targetModelSelect').value;
        const currentKey = modelQuestionsBank[selectedModel];
        const diffContainer = document.getElementById('diffGridContainer');
        diffContainer.innerHTML = '';

        const ansMap = { 'A': 'أ', 'B': 'ب', 'C': 'ج', 'D': 'د' };

        for (let i = 1; i <= 20; i++) {
            const studentVal = document.getElementById(`stud_ans_${i}`).value;
            const correctVal = currentKey[i];
            const isMatch = (studentVal === correctVal);

            const itemClass = isMatch ? 'diff-item match' : 'diff-item diff';
            const statusText = isMatch ? '🟢 مطابق (صحيح)' : '🔴 مختلف (خطأ)';

            diffContainer.innerHTML += `
                <div class="${itemClass}">
                    <span><strong>س${i}:</strong> تظليل الطالب (${ansMap[studentVal]}) | النموذج (${ansMap[correctVal]})</span>
                    <span><strong>${statusText}</strong></span>
                </div>
            `;
        }
    }

    function loadAllowedStudents() {
        db.collection("allowed_students").orderBy("name").get().then((snapshot) => {
            allStudents = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if(data.name) allStudents.push(data.name);
            });
            renderStudentDropdown(allStudents);
        });
    }

    function renderStudentDropdown(studentsArray) {
        const listDiv = document.getElementById('studentDropdownList');
        listDiv.innerHTML = '';
        if (studentsArray.length === 0) {
            listDiv.innerHTML = '<div class="student-item" style="color:#999;">لا توجد نتائج مطابقة</div>';
            return;
        }
        studentsArray.forEach(name => {
            const item = document.createElement('div');
            item.className = 'student-item';
            item.innerText = name;
            item.onclick = function() {
                document.getElementById('studentSearchInput').value = name;
                listDiv.style.display = 'none';
            };
            listDiv.appendChild(item);
        });
    }

    function showDropdown() {
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    function filterStudents() {
        const query = document.getElementById('studentSearchInput').value.trim().toLowerCase();
        const filtered = allStudents.filter(name => name.toLowerCase().includes(query));
        renderStudentDropdown(filtered);
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.student-select-box')) {
            document.getElementById('studentDropdownList').style.display = 'none';
        }
    });

    function previewCapturedImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('capturedImage').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
                imageCaptured = true;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // اعتماد النتيجة النهائية وإرسالها لقاعدة البيانات
    async function processAndSendToDashboard() {
        const studentName = document.getElementById('studentSearchInput').value.trim();
        const customModelName = document.getElementById('customModelName').value.trim() || "أوراق التظليل";
        const selectedModel = document.getElementById('targetModelSelect').value;
        const fileInput = document.getElementById('cameraInput');

        if (!studentName) {
            alert('الرجاء اختيار اسم الطالب من القائمة أولاً.');
            return;
        }
        if (!imageCaptured || fileInput.files.length === 0) {
            alert('الرجاء التقاط صورة ورقة الطالب بالكاميرا أولاً.');
            return;
        }

        const currentKey = modelQuestionsBank[selectedModel];
        let answersDetails = [];
        let score = 0;
        const ansMap = { 'A': 'أ', 'B': 'ب', 'C': 'ج', 'D': 'د' };
        
        for (let i = 1; i <= 20; i++) {
            let studentAnsKey = document.getElementById(`stud_ans_${i}`).value; 
            let correctAnsKey = currentKey[i]; 
            let isCorrect = (studentAnsKey === correctAnsKey);
            if (isCorrect) score++;

            answersDetails.push({
                qText: `السؤال رقم ${i}`,
                studentAns: `${studentAnsKey}) ${ansMap[studentAnsKey]}`,
                correctAns: `${correctAnsKey}) ${ansMap[correctAnsKey]}`,
                isCorrect: isCorrect,
                skill: i <= 4 ? 'est' : i <= 8 ? 'ikm' : i <= 12 ? 'swh' : i <= 16 ? 'arb' : 'sah'
            });
        }

        let p = Math.round((score / 20) * 100);
        let skillsObj = { est: p, ikm: p, swh: p, arb: p, sah: p, math: p };

        let recordData = {
            name: studentName,
            score: score,
            total: 20,
            model_id: customModelName,
            answers: answersDetails,
            sections: skillsObj,
            time: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("alkfaeat_results").add(recordData);
            alert(`✅ تم اعتماد درجة الطالب (${studentName}) بنجاح!\nالدرجة النهائية: ${score} من 20 (${p}%) تحت (${customModelName}) وتم إرسالها وحفظها في لوحة التحكم.`);
            
            // إعادة ضبط الحقول للطالب التالي
            document.getElementById('studentSearchInput').value = '';
            fileInput.value = '';
            document.getElementById('previewContainer').style.display = 'none';
            imageCaptured = false;
        } catch (error) {
            alert("حدث خطأ أثناء الإرسال لقاعدة البيانات.");
        }
    }
</script>

</body>
</html>
