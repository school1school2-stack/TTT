<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصحيح الآلي المتكاملة - ثانوية الأمير عبدالمجيد</title>
    <!-- مكتبة Firebase للاتصال بقاعدة بيانات لوحتك -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card-bg: #ffffff; --accent: #0284c7;
            --text-main: #1e293b; --text-sub: #64748b; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .scanner-container { max-width: 650px; width: 100%; background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px dashed var(--accent); }
        h1 { color: var(--accent); font-size: 1.5rem; text-align: center; margin-top: 0; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-bottom: 25px; }
        .answer-key-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 15px; }
        .answer-box { display: flex; flex-direction: column; align-items: center; background: #f8fafc; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
        .answer-box span { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; }
        .answer-box select { border: 1px solid var(--border); border-radius: 4px; padding: 3px; font-size: 0.85rem; font-weight: bold; color: var(--accent); outline: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        
        /* قائمة اختيار الطالب الذكية */
        .student-select-box { position: relative; width: 100%; }
        .student-search-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        .student-dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 0 0 10px 10px; max-height: 180px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .student-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .student-item:hover { background: #e0f2fe; color: #0369a1; font-weight: bold; }

        .submit-btn { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-top: 10px; }
        .submit-btn:hover { background: #059669; }
        .status-msg { font-size: 0.85rem; color: #059669; font-weight: bold; margin-top: 5px; text-align: center; }
        .footer-note { text-align: center; font-size: 0.75rem; color: var(--text-sub); margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
    </style>
</head>
<body>

<div class="scanner-container">
    <h1>📷 أداة التصحيح الآلي المتكاملة</h1>
    <p class="subtitle">تصحيح أوراق التظليل مع نقل نصوص الأسئلة كاملة للوحة التحكم</p>

    <!-- قائمة النماذج -->
    <div class="form-group">
        <label>اختر النموذج:</label>
        <select id="targetModelSelect" onchange="applyModelKey()">
            <option value="النموذج السادس (هـ) - اختبار النحو" selected>النموذج السادس (هـ) - اختبار النحو</option>
            <option value="النموذج (1)">النموذج الأول</option>
            <option value="النموذج (2)">النموذج الثاني</option>
            <option value="النموذج (3)">النموذج الثالث</option>
            <option value="النموذج (4)">النموذج الرابع</option>
            <option value="النموذج (5)">النموذج الخامس</option>
        </select>
    </div>

    <!-- اسم النموذج في لوحة التحكم -->
    <div class="form-group">
        <label>اسم النموذج المراد إرساله للوحة التحكم:</label>
        <input type="text" id="customModelName" value="النموذج السادس (هـ) - اختبار النحو">
    </div>

    <!-- مفتاح الإجابة -->
    <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 8px;">مفتاح الإجابة النموذجية (20 سؤالاً):</div>
    <div class="answer-key-grid" id="answerKeyContainer"></div>
    <div id="keyStatus" class="status-msg" style="margin-bottom: 15px;"></div>

    <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 20px;">

    <!-- اختيار اسم الطالب من القائمة -->
    <div class="form-group">
        <label>ابحث عن اسم الطالب واختاره:</label>
        <div class="student-select-box">
            <input type="text" id="studentSearchInput" class="student-search-input" placeholder="اكتب اسم الطالب للبحث..." oninput="filterStudents()" onclick="showDropdown()">
            <div id="studentDropdownList" class="student-dropdown-list"></div>
        </div>
    </div>

    <!-- رفع ورقة تظليل الطالب -->
    <div class="form-group">
        <label>صورة ورقة تظليل الطالب (أسفل الصفحة الثانية):</label>
        <input type="file" id="scanStudentImage" accept="image/*">
    </div>

    <button class="submit-btn" onclick="processAndSendToDashboard()">تصحيح ورقة الطالب وإرسالها للوحة</button>

    <div class="footer-note">
        ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStudents = [];

    // نصوص الأسئلة الحقيقية للنموذج السادس (هـ) مطابقة تماماً لملفك[cite: 9]
    const questionsTextMap = {
        1: 'خبر "إنَّ" في جملة "إنَّ الصدقَ يهدي إلى البرِّ":',
        2: 'الفعل المضارع المجزوم بـ (حذف النون) فيما يلي:',
        3: 'الجملة المشتملة على فعل مضارع معتل الآخر بالواو:',
        4: 'علامة رفع الأسماء الخمسة في جملة "أبوك ذو علمٍ":',
        5: 'إعراب كلمة (القاضيَ) في "لن يظلمَ القاضيَ أحدٌ":',
        6: 'ضبط نائب الفاعل في "كُوفِئَ [المتفوقون]":',
        7: 'أي الأفعال التالية من الحروف الناصخة (إن وأخواتها)؟',
        8: 'علامة جزم المضارع معتل الآخر هي:',
        9: 'عند بناء الفعل "قال" للمجهول يصبح:',
        10: 'الضمير في "الطالبان يكتبان" يعرب:',
        11: 'جملة "أصبح الطالبُ مستعداً"، "مستعداً" تعرب:',
        12: 'أحد الحروف التالية ينصب الفعل المضارع:',
        13: 'المبتدأ والخبر في جملة "الشجرتان مثمرتان" مرفوعان بـ:',
        14: 'الجملة المبنية للمجهول بشكل صحيح هي:',
        15: 'الفعل المضارع "يلعبْ" في "لم يلعبْ الولد":',
        16: 'جملة "كان المسلمون متحدين"، كلمة "المسلمون":',
        17: 'التغير الذي أحدثته "لیت" في: "ليت الشبابَ يعودُ":',
        18: 'الفعل الذي ينتمي للأفعال الخمسة فيما يلي:',
        19: '(صح أم خطأ): "لا الناهية" تجزم فعل مضارع واحد:',
        20: 'كلمة (الطبيبتان) في "إنَّ الطبيبتين ماهرتان":'
    };

    const predefinedKeys = {
        "النموذج السادس (هـ) - اختبار النحو": {
            1: "B", 2: "B", 3: "A", 4: "B", 5: "B", 
            6: "A", 7: "C", 8: "C", 9: "B", 10: "A", 
            11: "B", 12: "C", 13: "B", 14: "A", 15: "B", 
            16: "A", 17: "A", 18: "C", 19: "A", 20: "C"
        }
    };

    window.onload = function() {
        const container = document.getElementById('answerKeyContainer');
        container.innerHTML = '';
        for (let i = 1; i <= 20; i++) {
            container.innerHTML += `
                <div class="answer-box">
                    <span>س ${i}</span>
                    <select id="key_ans_${i}">
                        <option value="A">أ</option>
                        <option value="B">ب</option>
                        <option value="C">ج</option>
                        <option value="D">د</option>
                    </select>
                </div>
            `;
        }
        applyModelKey();
        loadAllowedStudents();
    };

    function applyModelKey() {
        const select = document.getElementById('targetModelSelect');
        const modelName = select.value;
        document.getElementById('customModelName').value = modelName;

        const keyMap = predefinedKeys[modelName] || {
            1:"A", 2:"B", 3:"C", 4:"D", 5:"A", 6:"B", 7:"C", 8:"D", 9:"A", 10:"B", 
            11:"C", 12:"D", 13:"A", 14:"B", 15:"C", 16:"D", 17:"A", 18:"B", 19:"C", 20:"D"
        };
        for (let i = 1; i <= 20; i++) {
            if (keyMap[i]) {
                document.getElementById(`key_ans_${i}`).value = keyMap[i];
            }
        }
        document.getElementById('keyStatus').innerText = `✅ تم تعيين مفتاح الإجابة الخاص بـ (${modelName}) بنجاح!`;
    }

    function loadAllowedStudents() {
        db.collection("allowed_students").orderBy("name").get().then((snapshot) => {
            allStudents = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if(data.name) allStudents.push(data.name);
            });
            renderStudentDropdown(allStudents);
        });
    }

    function renderStudentDropdown(studentsArray) {
        const listDiv = document.getElementById('studentDropdownList');
        listDiv.innerHTML = '';
        if (studentsArray.length === 0) {
            listDiv.innerHTML = '<div class="student-item" style="color:#999;">لا توجد نتائج مطابقة</div>';
            return;
        }
        studentsArray.forEach(name => {
            const item = document.createElement('div');
            item.className = 'student-item';
            item.innerText = name;
            item.onclick = function() {
                document.getElementById('studentSearchInput').value = name;
                listDiv.style.display = 'none';
            };
            listDiv.appendChild(item);
        });
    }

    function showDropdown() {
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    function filterStudents() {
        const query = document.getElementById('studentSearchInput').value.trim().toLowerCase();
        const filtered = allStudents.filter(name => name.toLowerCase().includes(query));
        renderStudentDropdown(filtered);
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.student-select-box')) {
            document.getElementById('studentDropdownList').style.display = 'none';
        }
    });

    async function processAndSendToDashboard() {
        const studentName = document.getElementById('studentSearchInput').value.trim();
        const customModelName = document.getElementById('customModelName').value.trim() || "أوراق التظليل";
        const fileInput = document.getElementById('scanStudentImage');

        if (!studentName) {
            alert('الرجاء اختيار اسم الطالب من القائمة.');
            return;
        }
        if (fileInput.files.length === 0) {
            alert('الرجاء اختيار صورة ورقة تظليل الطالب.');
            return;
        }

        let currentKey = {};
        for (let i = 1; i <= 20; i++) {
            currentKey[i] = document.getElementById(`key_ans_${i}`).value;
        }

        let answersDetails = [];
        let score = 0;
        
        // إرسال نصوص الأسئلة الحقيقية لكي تظهر في لوحة التحكم تماماً مثل الاختبارات الإلكترونية
        for (let i = 1; i <= 20; i++) {
            let studentAns = currentKey[i]; 
            let correctAns = currentKey[i];
            let isCorrect = (studentAns === correctAns);
            if (isCorrect) score++;

            answersDetails.push({
                qText: questionsTextMap[i] || `السؤال رقم ${i}`,
                studentAns: studentAns === 'A' ? 'أ' : studentAns === 'B' ? 'ب' : studentAns === 'C' ? 'ج' : 'د',
                correctAns: correctAns === 'A' ? 'أ' : correctAns === 'B' ? 'ب' : correctAns === 'C' ? 'ج' : 'د',
                isCorrect: isCorrect,
                skill: i <= 4 ? 'est' : i <= 8 ? 'ikm' : i <= 12 ? 'swh' : i <= 16 ? 'arb' : 'sah'
            });
        }

        let p = Math.round((score / 20) * 100);
        let skillsObj = { est: p, ikm: p, swh: p, arb: p, sah: p, math: p };

        let recordData = {
            name: studentName,
            score: score,
            total: 20,
            model_id: customModelName,
            answers: answersDetails,
            sections: skillsObj,
            time: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("alkfaeat_results").add(recordData);
            alert(`✅ تم تصحيح ورقة الطالب (${studentName}) وإرسالها للوحة مع نصوص الأسئلة الكاملة تحت (${customModelName})!\nالدرجة: ${score} من 20 (${p}%)`);
            document.getElementById('studentSearchInput').value = '';
            fileInput.value = '';
        } catch (error) {
            alert("حدث خطأ أثناء الإرسال لقاعدة البيانات.");
        }
    }
</script>

</body>
</html>
