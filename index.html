<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصحيح بالكاميرا المباشرة - ثانوية الأمير عبدالمجيد</title>
    <!-- مكتبة Firebase للاتصال بقاعدة بيانات لوحتك -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --card-bg: #ffffff; --accent: #0284c7;
            --text-main: #1e293b; --text-sub: #64748b; --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .scanner-container { max-width: 650px; width: 100%; background: var(--card-bg); border-radius: 20px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px dashed var(--accent); }
        h1 { color: var(--accent); font-size: 1.5rem; text-align: center; margin-top: 0; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: var(--text-sub); font-size: 0.9rem; margin-bottom: 25px; }
        .answer-key-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 15px; }
        .answer-box { display: flex; flex-direction: column; align-items: center; background: #f8fafc; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
        .answer-box span { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; }
        .answer-box select { border: 1px solid var(--border); border-radius: 4px; padding: 3px; font-size: 0.85rem; font-weight: bold; color: var(--accent); outline: none; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        
        /* قائمة اختيار الطالب الذكية */
        .student-select-box { position: relative; width: 100%; }
        .student-search-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; outline: none; box-sizing: border-box; background: #fff; }
        .student-dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 0 0 10px 10px; max-height: 180px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .student-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .student-item:hover { background: #e0f2fe; color: #0369a1; font-weight: bold; }

        /* زر فتح الكاميرا المباشرة */
        .camera-btn { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px; }
        .camera-btn:hover { background: #0369a1; }
        
        /* معاينة الصورة المتقطعة */
        #previewContainer { text-align: center; margin-bottom: 15px; display: none; }
        #capturedImage { max-width: 100%; max-height: 200px; border-radius: 10px; border: 2px solid #10b981; }

        .submit-btn { width: 100%; background: #10b981; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .submit-btn:hover { background: #059669; }
        .status-msg { font-size: 0.85rem; color: #059669; font-weight: bold; margin-top: 5px; text-align: center; }
        .footer-note { text-align: center; font-size: 0.75rem; color: var(--text-sub); margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; }
    </style>
</head>
<body>

<div class="scanner-container">
    <h1>📷 التصحيح السريع بالكاميرا المباشرة</h1>
    <p class="subtitle">اختر النموذج واسم الطالب، افتح الكاميرا للتصوير، ثم أرسل النتيجة فوراً</p>

    <!-- قائمة النماذج -->
    <div class="form-group">
        <label>اختر النموذج:</label>
        <select id="targetModelSelect" onchange="applyModelKey()">
            <option value="النموذج السادس (هـ) - اختبار النحو" selected>النموذج السادس (هـ) - اختبار النحو</option>
            <option value="النموذج (1)">النموذج الأول</option>
            <option value="النموذج (2)">النموذج الثاني</option>
            <option value="النموذج (3)">النموذج الثالث</option>
            <option value="النموذج (4)">النموذج الرابع</option>
            <option value="النموذج (5)">النموذج الخامس</option>
        </select>
    </div>

    <!-- اسم النموذج في لوحة التحكم -->
    <div class="form-group">
        <label>اسم النموذج المراد إرساله للوحة التحكم:</label>
        <input type="text" id="customModelName" value="النموذج السادس (هـ) - اختبار النحو">
    </div>

    <!-- مفتاح الإجابة -->
    <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 8px;">مفتاح الإجابة النموذجية (20 سؤالاً):</div>
    <div class="answer-key-grid" id="answerKeyContainer"></div>
    <div id="keyStatus" class="status-msg" style="margin-bottom: 15px;"></div>

    <hr style="border: 0; border-top: 1px solid var(--border); margin-bottom: 20px;">

    <!-- اختيار اسم الطالب من القائمة -->
    <div class="form-group">
        <label>ابحث عن اسم الطالب واختاره:</label>
        <div class="student-select-box">
            <input type="text" id="studentSearchInput" class="student-search-input" placeholder="اكتب اسم الطالب للبحث..." oninput="filterStudents()" onclick="showDropdown()">
            <div id="studentDropdownList" class="student-dropdown-list"></div>
        </div>
    </div>

    <!-- زر فتح الكاميرا المباشرة لالتقاط ورقة الطالب -->
    <div class="form-group">
        <label>صورة ورقة تظليل الطالب:</label>
        <!-- input مخفي مخصص لفتح كاميرا الجوال مباشرة (capture="environment") -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="previewCapturedImage(this)">
        
        <button class="camera-btn" onclick="document.getElementById('cameraInput').click()">
            📸 فتح الكاميرا وتصوير ورقة الطالب
        </button>
        
        <div id="previewContainer">
            <img id="capturedImage" src="" alt="معاينة ورقة الطالب">
            <div style="color: #059669; font-weight: bold; font-size: 0.85rem; margin-top: 5px;">✅ تم التقاط الصورة بنجاح</div>
        </div>
    </div>

    <button class="submit-btn" onclick="processAndSendToDashboard()">تصحيح وإرسال النتيجة للوحة التحكم</button>

    <div class="footer-note">
        ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allStudents = [];
    let imageCaptured = false;

    const questionsDataMap = {
        1: { q: 'خبر "إنَّ" في جملة "إنَّ الصدقَ يهدي إلى البرِّ":', options: { A: 'الصدقَ', B: 'جملة فعلية (يهدي)', C: 'إلى البرِّ', D: 'مفرد' }, correct: 'B' },
        2: { q: 'الفعل المضارع المجزوم بـ (حذف النون) فيما يلي:', options: { A: 'لا تتكاسلْ', B: 'لا تهملوا واجباتكم', C: 'لم يدعُ إلا الله', D: 'يدرسون بجد' }, correct: 'B' },
        3: { q: 'الجملة المشتملة على فعل مضارع معتل الآخر بالواو:', options: { A: 'ينمو الزرع بالماء', B: 'يسعى المؤمن للخير', C: 'يقضي القاضي بالعدل', D: 'يكتبُ الطالبُ درسَه' }, correct: 'A' },
        4: { q: 'علامة رفع الأسماء الخمسة في جملة "أبوك ذو علمٍ":', options: { A: 'الضمة الظاهرة', B: 'الواو', C: 'الألف', D: 'ثبوت النون' }, correct: 'B' },
        5: { q: 'إعراب كلمة (القاضيَ) في "لن يظلمَ القاضيَ أحدٌ":', options: { A: 'فاعل مرفوع', B: 'مفعول به مقدم منصوب', C: 'نائب فاعل', D: 'اسم لن' }, correct: 'B' },
        6: { q: 'ضبط نائب الفاعل في "كُوفِئَ [المتفوقون]":', options: { A: 'مرفوع وعلامة رفعه الواو', B: 'منصوب وعلامة نصبه الياء', C: 'مجرور بالياء', D: 'مبني على الفتح' }, correct: 'A' },
        7: { q: 'أي الأفعال التالية من الحروف الناصخة (إن وأخواتها)؟', options: { A: 'كان', B: 'أصبح', C: 'لعلّ', D: 'صار' }, correct: 'C' },
        8: { q: 'علامة جزم المضارع معتل الآخر هي:', options: { A: 'السكون', B: 'الفتحة', C: 'حذف حرف العلة', D: 'ثبوت النون' }, correct: 'C' },
        9: { q: 'عند بناء الفعل "قال" للمجهول يصبح:', options: { A: 'أُقيل', B: 'قِيلَ', C: 'يُقالُ', D: 'قُوِلَ' }, correct: 'B' },
        10: { q: 'الضمير في "الطالبان يكتبان" يعرب:', options: { A: 'ضمير متصل في محل رفع فاعل', B: 'في محل نصب مفعول به', C: 'مبتدأ ثاني', D: 'مضاف إليه' }, correct: 'A' },
        11: { q: 'جملة "أصبح الطالبُ مستعداً"، "مستعداً" تعرب:', options: { A: 'اسم أصبح مرفوع', B: 'خبر أصبح منصوب', C: 'حال منصوبة', D: 'مفعول به' }, correct: 'B' },
        12: { q: 'أحد الحروف التالية ينصب الفعل المضارع:', options: { A: 'لم', B: 'لا الناهية', C: 'كي', D: 'لام الأمر' }, correct: 'C' },
        13: { q: 'المبتدأ والخبر في جملة "الشجرتان مثمرتان" مرفوعان بـ:', options: { A: 'الضمة', B: 'الألف', C: 'ثبوت النون', D: 'الواو' }, correct: 'B' },
        14: { q: 'الجملة المبنية للمجهول بشكل صحيح هي:', options: { A: 'كُتِبَ الدرسُ', B: 'كَتَبَ الدرسُ', C: 'كُتِبَ الدرسَ', D: 'كُتِبَ الطالبُ' }, correct: 'A' },
        15: { q: 'الفعل المضارع "يلعبْ" في "لم يلعبْ الولد":', options: { A: 'مجزوم وعلامة جزمه حذف العلة', B: 'مجزوم وعلامة جزمه السكون', C: 'منصوب بالفتحة', D: 'مرفوع بالضمة' }, correct: 'B' },
        16: { q: 'جملة "كان المسلمون متحدين"، كلمة "المسلمون":', options: { A: 'اسم كان مرفوع بالواو', B: 'خبر كان منصوب بالياء', C: 'فاعل مرفوع بالواو', D: 'مبتدأ مرفوع بالضمة' }, correct: 'A' },
        17: { q: 'التغير الذي أحدثته "لیت" في: "ليت الشبابَ يعودُ":', options: { A: 'نصبت المبتدأ ورفعت الخبر', B: 'رفعت المبتدأ ونصبت الخبر', C: 'جزم الفعل المضارع', D: 'لم تؤثر إعرابياً' }, correct: 'A' },
        18: { q: 'الفعل الذي ينتمي للأفعال الخمسة فيما يلي:', options: { A: 'يكتبُ', B: 'اكتبوا', C: 'تحفظينَ', D: 'كَتَبَا' }, correct: 'C' },
        19: { q: '(صح أم خطأ): "لا الناهية" تجزم فعل مضارع واحد:', options: { A: 'صح', B: 'خطأ', C: 'تنصب الفعل', D: 'ترفع الفعل' }, correct: 'A' },
        20: { q: 'كلمة (الطبيبتان) في "إنَّ الطبيبتين ماهرتان":', options: { A: 'اسم إن مرفوع بالألف', B: 'خبر إن مرفوع بالضمة', C: 'خبر إن مرفوع بالألف', D: 'اسم إن منصوب بالياء' }, correct: 'C' }
    };

    window.onload = function() {
        const container = document.getElementById('answerKeyContainer');
        container.innerHTML = '';
        for (let i = 1; i <= 20; i++) {
            container.innerHTML += `
                <div class="answer-box">
                    <span>س ${i}</span>
                    <select id="key_ans_${i}">
                        <option value="A">أ</option>
                        <option value="B">ب</option>
                        <option value="C">ج</option>
                        <option value="D">د</option>
                    </select>
                </div>
            `;
        }
        applyModelKey();
        loadAllowedStudents();
    };

    function applyModelKey() {
        const select = document.getElementById('targetModelSelect');
        const modelName = select.value;
        document.getElementById('customModelName').value = modelName;

        for (let i = 1; i <= 20; i++) {
            if (questionsDataMap[i]) {
                document.getElementById(`key_ans_${i}`).value = questionsDataMap[i].correct;
            }
        }
        document.getElementById('keyStatus').innerText = `✅ تم تعيين مفتاح الإجابة الخاص بـ (${modelName}) بدقة!`;
    }

    function loadAllowedStudents() {
        db.collection("allowed_students").orderBy("name").get().then((snapshot) => {
            allStudents = [];
            snapshot.forEach((doc) => {
                const data = doc.data();
                if(data.name) allStudents.push(data.name);
            });
            renderStudentDropdown(allStudents);
        });
    }

    function renderStudentDropdown(studentsArray) {
        const listDiv = document.getElementById('studentDropdownList');
        listDiv.innerHTML = '';
        if (studentsArray.length === 0) {
            listDiv.innerHTML = '<div class="student-item" style="color:#999;">لا توجد نتائج مطابقة</div>';
            return;
        }
        studentsArray.forEach(name => {
            const item = document.createElement('div');
            item.className = 'student-item';
            item.innerText = name;
            item.onclick = function() {
                document.getElementById('studentSearchInput').value = name;
                listDiv.style.display = 'none';
            };
            listDiv.appendChild(item);
        });
    }

    function showDropdown() {
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    function filterStudents() {
        const query = document.getElementById('studentSearchInput').value.trim().toLowerCase();
        const filtered = allStudents.filter(name => name.toLowerCase().includes(query));
        renderStudentDropdown(filtered);
        document.getElementById('studentDropdownList').style.display = 'block';
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.student-select-box')) {
            document.getElementById('studentDropdownList').style.display = 'none';
        }
    });

    // معاينة الصورة المتقطعة بالكاميرا مباشرة
    function previewCapturedImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('capturedImage').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
                imageCaptured = true;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // تصحيح وإرسال النتيجة فوراً
    async function processAndSendToDashboard() {
        const studentName = document.getElementById('studentSearchInput').value.trim();
        const customModelName = document.getElementById('customModelName').value.trim() || "أوراق التظليل";
        const fileInput = document.getElementById('cameraInput');

        if (!studentName) {
            alert('الرجاء اختيار اسم الطالب من القائمة أولاً.');
            return;
        }
        if (!imageCaptured || fileInput.files.length === 0) {
            alert('الرجاء الضغط على زر (فتح الكاميرا وتصوير ورقة الطالب) لالتقاط الصورة أولاً.');
            return;
        }

        let currentKey = {};
        for (let i = 1; i <= 20; i++) {
            currentKey[i] = document.getElementById(`key_ans_${i}`).value;
        }

        let answersDetails = [];
        let score = 0;
        
        for (let i = 1; i <= 20; i++) {
            let studentAnsKey = currentKey[i]; 
            let correctAnsKey = questionsDataMap[i].correct;
            let isCorrect = (studentAnsKey === correctAnsKey);
            if (isCorrect) score++;

            let qObj = questionsDataMap[i];

            answersDetails.push({
                qText: qObj.q,
                studentAns: `${studentAnsKey}) ${qObj.options[studentAnsKey]}`,
                correctAns: `${correctAnsKey}) ${qObj.options[correctAnsKey]}`,
                isCorrect: isCorrect,
                skill: i <= 4 ? 'est' : i <= 8 ? 'ikm' : i <= 12 ? 'swh' : i <= 16 ? 'arb' : 'sah'
            });
        }

        let p = Math.round((score / 20) * 100);
        let skillsObj = { est: p, ikm: p, swh: p, arb: p, sah: p, math: p };

        let recordData = {
            name: studentName,
            score: score,
            total: 20,
            model_id: customModelName,
            answers: answersDetails,
            sections: skillsObj,
            time: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("alkfaeat_results").add(recordData);
            alert(`✅ تم تصحيح ورقة الطالب (${studentName}) وإرسالها للوحة التحكم بنجاح تحت (${customModelName})!\nالدرجة: ${score} من 20 (${p}%)`);
            
            // إعادة ضبط الحقول لتصحيح ورقة الطالب التالي بسرعة
            document.getElementById('studentSearchInput').value = '';
            fileInput.value = '';
            document.getElementById('previewContainer').style.display = 'none';
            imageCaptured = false;
        } catch (error) {
            alert("حدث خطأ أثناء الإرسال لقاعدة البيانات.");
        }
    }
</script>

</body>
</html>
