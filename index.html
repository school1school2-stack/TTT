<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أداة التصحيح الآلي - ثانوية الأمير عبدالمجيد</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f8fafc; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #0284c7; text-align: center; font-size: 1.3rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; background: #f1f5f9; padding: 10px; border-radius: 8px; margin-bottom: 15px; }
        .box { background: #fff; padding: 5px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.8rem; }
        .box select { width: 100%; padding: 2px; text-align: center; font-weight: bold; }
        .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-submit { background: #10b981; }
        .dropdown { position: absolute; background: #fff; border: 1px solid #cbd5e1; width: 100%; max-height: 120px; overflow-y: auto; display: none; z-index: 10; }
        .dropdown-item { padding: 8px; cursor: pointer; }
        .dropdown-item:hover { background: #e0f2fe; }
    </style>
</head>
<body>

<div class="container">
    <h1>أداة التصحيح الآلي المعتمدة</h1>

    <div class="form-group">
        <label>اختر النموذج:</label>
        <select id="modelSelect" onchange="updateKeys()">
            <option value="النموذج الأول (أ)">النموذج الأول (أ)</option>
            <option value="النموذج الثاني (ب)">النموذج الثاني (ب)</option>
            <option value="النموذج الثالث (ج)">النموذج الثالث (ج)</option>
            <option value="النموذج الرابع (د)">النموذج الرابع (د)</option>
            <option value="النموذج الخامس (هـ)">النموذج الخامس (هـ)</option>
        </select>
    </div>

    <div class="form-group" style="position:relative;">
        <label>ابحث عن اسم الطالب:</label>
        <input type="text" id="searchStudent" placeholder="اكتب اسم الطالب..." autocomplete="off" oninput="filterStudents()" onclick="showList()">
        <div id="studentList" class="dropdown"></div>
    </div>

    <div class="form-group">
        <label>تصوير ورقة الطالب:</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="previewImage(this)">
        <button class="btn" onclick="document.getElementById('cameraInput').click()">📸 فتح الكاميرا وتصوير الورقة</button>
        <div id="previewText" style="color: #10b981; font-weight: bold; font-size: 0.85rem; text-align: center; display:none;">✅ تم التقاط ورقة الطالب بنجاح</div>
    </div>

    <label>مفاتيح الإجابة وإجابات الطالب:</label>
    <div class="grid" id="answersGrid"></div>

    <button class="btn btn-submit" onclick="sendResult()">تصحيح وإرسال الدرجة للوحة التحكم</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBkCO7FDQXd89YDf843J4_AtvEFvzzt-R0",
        authDomain: "aztlg-494c3.firebaseapp.com",
        projectId: "aztlg-494c3",
        storageBucket: "aztlg-494c3.firebasestorage.app",
        messagingSenderId: "597051893949",
        appId: "1:597051893949:web:de5554ac900317a92b2fd4"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    let students = [];
    let imageReady = false;

    // مفاتيح الإجابة الصحيحة الثابتة للنماذج الستة/الخمسة
    const keys = {
        "النموذج الأول (أ)": ['B','A','C','B','C','A','C','C','B','A','B','A','A','B','B','A','B','B','C','A'],
        "النموذج الثاني (ب)": ['C','B','D','C','A','D','B','A','C','B','D','C','A','A','B','A','C','D','B','A'],
        "النموذج الثالث (ج)": ['D','A','C','B','B','D','C','C','B','B','C','B','C','B','C','B','D','B','B','B'],
        "النموذج الرابع (د)": ['C','B','A','B','C','A','D','C','B','A','A','D','B','A','B','A','C','C','A','D'],
        "النموذج الخامس (هـ)": ['B','B','A','A','B','A','C','C','B','A','B','C','B','A','B','A','A','C','A','C']
    };

    window.onload = function() {
        updateKeys();
        fetchStudents();
    };

    function updateKeys() {
        let model = document.getElementById('modelSelect').value;
        let modelKeys = keys[model] || keys["النموذج الأول (أ)"];
        let grid = document.getElementById('answersGrid');
        grid.innerHTML = '';

        for (let i = 0; i < 20; i++) {
            let qNum = i + 1;
            let correct = modelKeys[i];
            grid.innerHTML += `
                <div class="box" id="box_${qNum}">
                    <div>س${qNum}</div>
                    <div style="color:#10b981; font-weight:bold;">${correct}</div>
                    <select id="ans_${qNum}">
                        <option value="A">أ</option>
                        <option value="B">ب</option>
                        <option value="C">ج</option>
                        <option value="D">د</option>
                    </select>
                </div>
            `;
            document.getElementById(`ans_${qNum}`).value = correct;
        }
    }

    function fetchStudents() {
        db.collection("allowed_students").get().then((snapshot) => {
            students = [];
            snapshot.forEach(doc => {
                if(doc.data().name) students.push(doc.data().name);
            });
            renderList(students);
        }).catch(err => console.log(err));
    }

    function renderList(arr) {
        let list = document.getElementById('studentList');
        list.innerHTML = '';
        if(arr.length === 0) {
            list.innerHTML = '<div class="dropdown-item">لا توجد نتائج</div>';
            return;
        }
        arr.forEach(name => {
            let div = document.createElement('div');
            div.className = 'dropdown-item';
            div.innerText = name;
            div.onclick = function() {
                document.getElementById('searchStudent').value = name;
                list.style.display = 'none';
            };
            list.appendChild(div);
        });
    }

    function showList() {
        document.getElementById('studentList').style.display = 'block';
    }

    function filterStudents() {
        let val = document.getElementById('searchStudent').value.toLowerCase();
        let filtered = students.filter(s => s.toLowerCase().includes(val));
        renderList(filtered);
        document.getElementById('studentList').style.display = 'block';
    }

    function previewImage(input) {
        if(input.files && input.files[0]) {
            imageReady = true;
            document.getElementById('previewText').style.display = 'block';
        }
    }

    async function sendResult() {
        let name = document.getElementById('searchStudent').value.trim();
        let model = document.getElementById('modelSelect').value;
        let modelKeys = keys[model];

        if(!name) { alert('الرجاء اختيار اسم الطالب'); return; }
        if(!imageReady) { alert('الرجاء التقاط صورة ورقة الطالب أولاً'); return; }

        let score = 0;
        let answersDetails = [];

        for(let i = 0; i < 20; i++) {
            let qNum = i + 1;
            let studAns = document.getElementById(`ans_${qNum}`).value;
            let correctAns = modelKeys[i];
            let isCorrect = (studAns === correctAns);
            if(isCorrect) score++;

            answersDetails.push({
                qText: `السؤال رقم ${qNum}`,
                studentAns: studAns,
                correctAns: correctAns,
                isCorrect: isCorrect,
                skill: 'general'
            });
        }

        let percent = Math.round((score / 20) * 100);

        let data = {
            name: name,
            score: score,
            total: 20,
            model_id: model,
            answers: answersDetails,
            sections: { est: percent, ikm: percent, swh: percent, arb: percent, sah: percent, math: percent },
            time: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("alkfaeat_results").add(data);
            alert(`✅ تم تصحيح وإرسال درجة الطالب (${name}) بنجاح! الدرجة: ${score} / 20`);
            document.getElementById('searchStudent').value = '';
            document.getElementById('previewText').style.display = 'none';
            imageReady = false;
            updateKeys();
        } catch(e) {
            alert('حدث خطأ أثناء الإرسال لقاعدة البيانات');
            console.error(e);
        }
    }

    document.addEventListener('click', function(e) {
        if(!e.target.closest('.form-group')) {
            document.getElementById('studentList').style.display = 'none';
        }
    });
</script>

</body>
</html>
